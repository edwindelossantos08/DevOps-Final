# Configuracion minima de Loki para un entorno de demostracion,
# con almacenamiento en sistema de archivos y sin autenticacion.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Rechaza entradas con marca de tiempo demasiado antigua
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Retencion de 7 dias, suficiente para la demo del proyecto
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
