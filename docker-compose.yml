# Stack completo de TaskFlow: aplicacion + monitoreo (metricas, logs y alertas).
# Uso: docker compose up -d --build

name: taskflow

services:
  # ---------- Aplicacion ----------
  app:
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: taskflow:${APP_VERSION:-local}
    container_name: taskflow-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INSTANCE_ID: app-1
    volumes:
      # Persistencia de la base SQLite entre reinicios del contenedor
      - taskflow-data:/app/data
      # Los logs se comparten con Promtail para el envio centralizado a Loki
      - taskflow-logs:/app/logs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [taskflow-net]

  # ---------- Metricas ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: taskflow-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on: [app]
    networks: [taskflow-net]

  # ---------- Alertas ----------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: taskflow-alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks: [taskflow-net]

  # ---------- Logs centralizados ----------
  loki:
    image: grafana/loki:3.1.1
    container_name: taskflow-loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks: [taskflow-net]

  promtail:
    image: grafana/promtail:3.1.1
    container_name: taskflow-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Monta el mismo volumen de logs que escribe la aplicacion
      - taskflow-logs:/var/log/taskflow:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on: [loki]
    networks: [taskflow-net]

  # ---------- Visualizacion ----------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: taskflow-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      # Credenciales de la demo. En un entorno real irian en un gestor de secretos
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_LOG_LEVEL: warn
    volumes:
      # Aprovisionamiento como codigo: datasources y dashboards versionados en git
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    networks: [taskflow-net]

# Red interna: los servicios se resuelven entre si por nombre de contenedor
networks:
  taskflow-net:
    driver: bridge

volumes:
  taskflow-data:
  taskflow-logs:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
